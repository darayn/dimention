<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="dimention is cooking.">
  <title>dimention — cooking</title>
  <style>
    :root { --bg:#f7f8f5; --fg:#151618; --muted:#858991; --line:#dfe2dc; --accent:#5e57e8; --soft:#eef0eb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:Arial, Helvetica, sans-serif; }
    .wrap { width:min(900px, calc(100% - 40px)); margin:auto; padding:28px 0 56px; }
    header { display:flex; justify-content:space-between; align-items:center; font-size:14px; }
    .logo { font-weight:700; letter-spacing:-.04em; }
    .status { color:var(--accent); font:12px monospace; }
    main { padding:clamp(100px, 20vh, 190px) 0 0; }
    h1 { margin:0; font-size:clamp(60px, 13vw, 140px); line-height:.85; letter-spacing:-.09em; font-weight:700; }
    h1 span { color:var(--accent); }
    .intro { margin:30px 0 58px; color:var(--muted); font-size:18px; line-height:1.45; }
    .matrix { position:relative; display:grid; grid-template-columns:repeat(15, 1fr); gap:7px; padding:34px 18px; border:1px solid var(--line); background:rgba(255,255,255,.58); overflow:hidden; }
    .matrix::before { content:""; position:absolute; inset:18px; background-image:linear-gradient(90deg, transparent 49%, var(--line) 50%, transparent 51%), linear-gradient(0deg, transparent 49%, var(--line) 50%, transparent 51%); background-size:7.14% 100%, 100% 20%; opacity:.45; }
    .layer { position:relative; z-index:1; display:flex; flex-direction:column; justify-content:space-around; align-items:center; height:230px; }
    .layer::after { content:""; position:absolute; top:50%; left:calc(50% + 4px); width:calc(100% + 7px); border-top:1px solid #c5c8c2; transform:scaleX(0); transform-origin:left; animation:edge 12s ease-in-out infinite; }
    .layer:nth-child(1)::after { animation-delay:0s; } .layer:nth-child(2)::after { animation-delay:.35s; } .layer:nth-child(3)::after { animation-delay:.7s; } .layer:nth-child(4)::after { animation-delay:1.05s; } .layer:nth-child(5)::after { animation-delay:1.4s; } .layer:nth-child(6)::after { animation-delay:1.75s; } .layer:nth-child(7)::after { animation-delay:2.1s; } .layer:nth-child(8)::after { animation-delay:2.45s; } .layer:nth-child(9)::after { animation-delay:2.8s; } .layer:nth-child(10)::after { animation-delay:3.15s; } .layer:nth-child(11)::after { animation-delay:3.5s; } .layer:nth-child(12)::after { animation-delay:3.85s; } .layer:nth-child(13)::after { animation-delay:4.2s; } .layer:nth-child(14)::after { animation-delay:4.55s; }
    .layer:last-child::after { display:none; }
    .node { width:12px; height:12px; border:1px solid var(--accent); border-radius:50%; background:var(--bg); box-shadow:0 0 0 5px rgba(94,87,232,.08); opacity:0; transform:scale(.4); animation:node 12s ease-in-out infinite; }
    .layer:nth-child(2) .node, .layer:nth-child(4) .node, .layer:nth-child(6) .node, .layer:nth-child(8) .node { width:9px; height:9px; border-color:#a3a6ad; box-shadow:none; }
    .layer:nth-child(1) .node { animation-delay:0s; } .layer:nth-child(2) .node { animation-delay:.35s; } .layer:nth-child(3) .node { animation-delay:.7s; } .layer:nth-child(4) .node { animation-delay:1.05s; } .layer:nth-child(5) .node { animation-delay:1.4s; } .layer:nth-child(6) .node { animation-delay:1.75s; } .layer:nth-child(7) .node { animation-delay:2.1s; } .layer:nth-child(8) .node { animation-delay:2.45s; } .layer:nth-child(9) .node { animation-delay:2.8s; } .layer:nth-child(10) .node { animation-delay:3.15s; } .layer:nth-child(11) .node { animation-delay:3.5s; } .layer:nth-child(12) .node { animation-delay:3.85s; } .layer:nth-child(13) .node { animation-delay:4.2s; } .layer:nth-child(14) .node { animation-delay:4.55s; } .layer:nth-child(15) .node { animation-delay:4.9s; }
    .caption { display:flex; justify-content:space-between; margin-top:12px; color:var(--muted); font:12px monospace; }
    .formula { margin-top:18px; color:var(--muted); font:13px monospace; }
    .formula b { color:var(--accent); font-weight:400; }
    @keyframes node { 0%, 8% { opacity:0; transform:scale(.4); } 16%, 78% { opacity:1; transform:scale(1); } 92%, 100% { opacity:0; transform:scale(.4); } }
    @keyframes edge { 0%, 12% { transform:scaleX(0); opacity:0; } 20%, 78% { transform:scaleX(1); opacity:1; } 92%, 100% { transform:scaleX(0); opacity:0; } }
    footer { margin-top:26px; color:#4d515a; font:12px monospace; }
    @media (max-width:650px) { .wrap { width:calc(100% - 28px); } main { padding-top:100px; } .intro { margin:25px 0 42px; font-size:16px; } .matrix { gap:3px; padding:26px 8px; } .layer { height:170px; } .layer::after { width:calc(100% + 3px); } .node { width:8px; height:8px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="logo">dimention.ai</div><div class="status">● cooking</div></header>
    <main>
      <footer>something is taking shape_</footer>
    </main>
  </div>
</body>
</html>
